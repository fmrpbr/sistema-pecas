<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Controle OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ESTILOS GERAIS (MANTIDOS) */
        :root { --dark-bg: #4a4a4a; --header-bg: #666666; --row-hover: #f1f1f1; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; outline: none; }
        body { background: #e5e5e5; padding: 20px; }
        
        /* TELA DE LOGIN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2d3436; display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box h2 { margin-bottom: 20px; color: #333; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-login:hover { background: #0056b3; }
        .error-msg { color: red; margin-top: 10px; font-size: 14px; display: none; }

        /* CONTEÚDO DO APP (ESCONDIDO INICIALMENTE) */
        #app-content { display: none; }

        /* ESTILOS DA TABELA E MODAL (MANTIDOS) */
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { cursor: pointer; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 700; transition: 0.2s; }
        .btn-add { background: #28a745; color: white; }
        .btn-logout { background: #dc3545; color: white; margin-left: 10px; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 13px; }
        thead th { background: #666; color: white; padding: 10px; border: 1px solid #444; }
        tbody td { padding: 8px 10px; border: 1px solid #ccc; text-align: center; color: #333; font-weight: 500; }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Status Cores */
        .status-pendente td { color: #cf9f14 !important; font-weight: 700; }
        .status-devolucao td { color: #cc0000 !important; font-weight: 700; background-color: #fff0f0; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 800px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-cancel { background: #6c757d; color: white; } 
        .btn-save { background: #007bff; color: white; }
        .btn-del { background: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>🔒 Acesso Restrito</h2>
            <input type="email" id="email" class="login-input" placeholder="Seu E-mail">
            <input type="password" id="password" class="login-input" placeholder="Sua Senha">
            <button id="btnLogin" class="btn-login">ENTRAR NO SISTEMA</button>
            <p id="errorMsg" class="error-msg">E-mail ou senha incorretos.</p>
        </div>
    </div>

    <div id="app-content">
        <div class="container">
            <div class="top-bar">
                <h1>Controle de OS</h1>
                <div>
                    <button onclick="abrirModal()" class="btn btn-add">+ NOVO</button>
                    <button id="btnLogout" class="btn btn-logout">SAIR</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>DATA</th><th>OS</th><th>TIPO</th><th>MODELO</th>
                            <th>VALOR PEÇA</th><th>VALOR OS</th><th>STATUS</th>
                            <th>PAGAMENTO</th><th>FORNECEDOR</th><th>AÇÃO</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <h2>Registrar OS</h2>
            <br>
            <form id="formOS">
                <div class="form-grid">
                    <div class="form-group"><label>DATA</label><input type="date" id="data" required></div>
                    <div class="form-group"><label>OS</label><input type="number" id="os" required></div>
                    <div class="form-group"><label>TIPO</label><input type="text" id="tipo" required></div>
                    <div class="form-group"><label>MODELO</label><input type="text" id="modelo" required></div>
                    <div class="form-group"><label>R$ PEÇA</label><input type="number" id="valorPeca" step="0.01"></div>
                    <div class="form-group"><label>R$ OS</label><input type="number" id="valorOS" step="0.01"></div>
                    <div class="form-group">
                        <label>STATUS</label>
                        <select id="status">
                            <option value="FINALIZADO">FINALIZADO</option>
                            <option value="PENDENTE">PENDENTE</option>
                            <option value="DEVOLUÇÃO">DEVOLUÇÃO</option>
                        </select>
                    </div>
                    <div class="form-group"><label>PAGTO</label><input type="text" id="pagamento"></div>
                    <div class="form-group"><label>FORNECEDOR</label><input type="text" id="fornecedor"></div>
                </div>
                <div class="actions">
                    <button type="button" onclick="fecharModal()" class="btn btn-cancel">CANCELAR</button>
                    <button type="submit" class="btn btn-save">SALVAR</button>
                </div>
            </form>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
    // IMPORTANTE: Adicionando Auth
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCoN6SK7Erhh5f67vGNwuP_cGA_LGeNm4U",
        authDomain: "controledeos-2de2c.firebaseapp.com",
        projectId: "controledeos-2de2c",
        storageBucket: "controledeos-2de2c.firebasestorage.app",
        messagingSenderId: "1037478732552",
        appId: "1:1037478732552:web:3d32412d5a713c3cc042bd",
        measurementId: "G-FQ94ZVSLF5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- LÓGICA DE LOGIN ---
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const errorMsg = document.getElementById('errorMsg');

    // Monitora se o usuário está logado ou não
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Se logado: Esconde login, mostra app e carrega dados
            loginScreen.style.display = 'none';
            appContent.style.display = 'block';
            carregarDados();
        } else {
            // Se deslogado: Mostra login, esconde app
            loginScreen.style.display = 'flex';
            appContent.style.display = 'none';
        }
    });

    // Botão de Login
    document.getElementById('btnLogin').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        
        signInWithEmailAndPassword(auth, email, pass)
            .catch((error) => {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Erro: " + error.message;
            });
    });

    // Botão de Sair
    document.getElementById('btnLogout').addEventListener('click', () => {
        signOut(auth);
    });

    // --- LÓGICA DO SISTEMA (MANTIDA) ---
    function formatarDataEstiloPlanilha(dataString) {
        if(!dataString) return "-";
        const meses = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
        const data = new Date(dataString + "T12:00:00");
        return `${data.getDate()}/${meses[data.getMonth()]}`;
    }

    function fmtMoeda(val) {
        if (!val || val == 0) return "-";
        return val.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    }

    async function carregarDados() {
        const tabela = document.getElementById('tabelaCorpo');
        tabela.innerHTML = '<tr><td colspan="10">Carregando dados seguros...</td></tr>';
        
        try {
            const q = query(collection(db, "controle_os"), orderBy("data", "desc"));
            const querySnapshot = await getDocs(q);
            tabela.innerHTML = '';
            
            querySnapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;
                let rowClass = "";
                if (item.status === "PENDENTE") rowClass = "status-pendente";
                if (item.status === "DEVOLUÇÃO") rowClass = "status-devolucao";
                if (item.status === "FINALIZADO") rowClass = "status-finalizado";

                const row = document.createElement('tr');
                row.className = rowClass;
                row.innerHTML = `
                    <td>${formatarDataEstiloPlanilha(item.data)}</td>
                    <td>${item.os}</td>
                    <td style="text-transform:uppercase">${item.tipo}</td>
                    <td style="text-transform:uppercase">${item.modelo}</td>
                    <td>${fmtMoeda(item.valorPeca)}</td>
                    <td>${fmtMoeda(item.valorOS)}</td>
                    <td style="text-transform:uppercase">${item.status}</td>
                    <td style="text-transform:uppercase">${item.pagamento || "-"}</td>
                    <td style="text-transform:uppercase">${item.fornecedor || "-"}</td>
                    <td><button class="btn-del" onclick="deletarItem('${id}')">X</button></td>
                `;
                tabela.appendChild(row);
            });
        } catch (error) {
            console.error(error);
            alert("Erro ao buscar dados. Você tem permissão?");
        }
    }

    document.getElementById('formOS').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dados = {
            data: document.getElementById('data').value,
            os: document.getElementById('os').value,
            tipo: document.getElementById('tipo').value.toUpperCase(),
            modelo: document.getElementById('modelo').value.toUpperCase(),
            valorPeca: parseFloat(document.getElementById('valorPeca').value) || 0,
            valorOS: parseFloat(document.getElementById('valorOS').value) || 0,
            status: document.getElementById('status').value,
            pagamento: document.getElementById('pagamento').value.toUpperCase(),
            fornecedor: document.getElementById('fornecedor').value.toUpperCase()
        };
        await addDoc(collection(db, "controle_os"), dados);
        fecharModal();
        carregarDados();
    });

    window.deletarItem = async (id) => {
        if(confirm("Apagar?")) {
            await deleteDoc(doc(db, "controle_os", id));
            carregarDados();
        }
    };
    window.abrirModal = () => {
        document.getElementById('modalRegistro').style.display = 'flex';
        document.getElementById('formOS').reset();
        document.getElementById('data').valueAsDate = new Date();
    };
    window.fecharModal = () => document.getElementById('modalRegistro').style.display = 'none';
</script>
</body>
</html>
