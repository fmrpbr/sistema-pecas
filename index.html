<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --dark-bg: #4a4a4a; --header-bg: #666666; --row-hover: #f1f1f1; --red-text: #cc0000; --yellow-text: #d4a017; --green-text: #166534; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; outline: none; }
        body { background: #e5e5e5; padding: 20px; }
        
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        
        /* Cabeçalho e Botão */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #333; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .btn { cursor: pointer; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 700; text-transform: uppercase; transition: 0.2s; }
        .btn-add { background: #28a745; color: white; }
        .btn-add:hover { background: #218838; }

        /* TABELA ESTILO PLANILHA */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 13px; }
        
        /* Cabeçalho da Tabela (Igual imagem) */
        thead th { 
            background: var(--header-bg); 
            color: white; 
            padding: 10px; 
            text-transform: uppercase; 
            font-weight: 700; 
            border: 1px solid #444;
            text-align: center;
        }

        /* Linhas da Tabela */
        tbody td { 
            padding: 8px 10px; 
            border: 1px solid #ccc; 
            text-align: center; /* Centralizado como na imagem */
            color: #333;
            font-weight: 500;
        }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        tbody tr:hover { background-color: #e2e6ea; }

        /* Estilos de Status (Cores da Imagem) */
        .status-pendente td { color: #cf9f14 !important; font-weight: 700; } /* Amarelo escuro */
        .status-devolucao td { color: #cc0000 !important; font-weight: 700; background-color: #fff0f0; } /* Vermelho */
        .status-finalizado td { color: #000 !important; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 800px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; color: #666; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-cancel { background: #6c757d; color: white; }
        .btn-save { background: #007bff; color: white; }
        
        .btn-del { background: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 2px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; }

    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>Controle de OS e Peças</h1>
        <button onclick="abrirModal()" class="btn btn-add">+ NOVO REGISTRO</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>DATA</th>
                    <th>OS</th>
                    <th>TIPO</th>
                    <th>MODELO</th>
                    <th>VALOR PEÇA</th>
                    <th>VALOR OS</th>
                    <th>STATUS</th>
                    <th>PAGAMENTO</th>
                    <th>FORNECEDOR</th>
                    <th>AÇÃO</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                </tbody>
        </table>
    </div>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 20px;">Registrar OS / Peça</h2>
        <form id="formOS">
            <input type="hidden" id="editId">
            
            <div class="form-grid">
                <div class="form-group">
                    <label>DATA</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label>Nº OS</label>
                    <input type="number" id="os" placeholder="8529" required>
                </div>
                <div class="form-group">
                    <label>TIPO (SERVIÇO)</label>
                    <input type="text" id="tipo" placeholder="EX: TELA, BATERIA" required>
                </div>

                <div class="form-group">
                    <label>MODELO</label>
                    <input type="text" id="modelo" placeholder="EX: A15 5G" required>
                </div>
                <div class="form-group">
                    <label>VALOR PEÇA (R$)</label>
                    <input type="number" id="valorPeca" step="0.01" placeholder="0,00">
                </div>
                <div class="form-group">
                    <label>VALOR OS (R$)</label>
                    <input type="number" id="valorOS" step="0.01" placeholder="0,00">
                </div>

                <div class="form-group">
                    <label>STATUS</label>
                    <select id="status">
                        <option value="FINALIZADO">FINALIZADO</option>
                        <option value="PENDENTE">PENDENTE (AMARELO)</option>
                        <option value="DEVOLUÇÃO">DEVOLUÇÃO (VERMELHO)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>PAGAMENTO</label>
                    <input type="text" id="pagamento" placeholder="DINHEIRO, PIX...">
                </div>
                <div class="form-group">
                    <label>FORNECEDOR</label>
                    <input type="text" id="fornecedor" placeholder="EX: BELA VISTA">
                </div>
            </div>
            
            <div class="actions">
                <button type="button" onclick="fecharModal()" class="btn btn-cancel">CANCELAR</button>
                <button type="submit" class="btn btn-save">SALVAR</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // --- CONFIGURAÇÃO FIREBASE (MANTENHA A SUA AQUI) ---
    const firebaseConfig = {
        apiKey: "AIzaSyBiN8FqX8UZeyAh1cG2GHZtQWiQH0xPBV4", 
        authDomain: "rephone-a0a80.firebaseapp.com", 
        projectId: "rephone-a0a80", 
        storageBucket: "rephone-a0a80.firebasestorage.app", 
        appId: "1:431497247030:web:a943715e4acc04b8995b97" 
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Formatar Data (ex: 2024-01-15 -> 15/jan)
    function formatarDataEstiloPlanilha(dataString) {
        if(!dataString) return "-";
        const meses = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
        const data = new Date(dataString + "T12:00:00"); // Ajuste de fuso simples
        return `${data.getDate()}/${meses[data.getMonth()]}`;
    }

    // Formatar Moeda (Se for 0, retorna -)
    function fmtMoeda(val) {
        if (!val || val == 0) return "-";
        return val.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    }

    // Renderizar Tabela
    async function carregarDados() {
        const tabela = document.getElementById('tabelaCorpo');
        tabela.innerHTML = '<tr><td colspan="10">Carregando...</td></tr>';
        
        // Ordena por data (mais recente primeiro, ou mude para 'asc' se preferir)
        const q = query(collection(db, "controle_os"), orderBy("data", "desc"));
        const querySnapshot = await getDocs(q);
        
        tabela.innerHTML = '';
        
        querySnapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;

            // Define a classe CSS baseada no status para colorir igual à imagem
            let rowClass = "";
            if (item.status === "PENDENTE") rowClass = "status-pendente";
            if (item.status === "DEVOLUÇÃO") rowClass = "status-devolucao";
            if (item.status === "FINALIZADO") rowClass = "status-finalizado";

            const row = document.createElement('tr');
            row.className = rowClass;

            row.innerHTML = `
                <td>${formatarDataEstiloPlanilha(item.data)}</td>
                <td>${item.os}</td>
                <td style="text-transform:uppercase">${item.tipo}</td>
                <td style="text-transform:uppercase">${item.modelo}</td>
                <td>${fmtMoeda(item.valorPeca)}</td>
                <td>${fmtMoeda(item.valorOS)}</td>
                <td style="text-transform:uppercase">${item.status}</td>
                <td style="text-transform:uppercase">${item.pagamento || "-"}</td>
                <td style="text-transform:uppercase">${item.fornecedor || "-"}</td>
                <td>
                    <button class="btn-del" onclick="deletarItem('${id}')">X</button>
                </td>
            `;
            tabela.appendChild(row);
        });
    }

    // Salvar Registro
    document.getElementById('formOS').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const dados = {
            data: document.getElementById('data').value,
            os: document.getElementById('os').value,
            tipo: document.getElementById('tipo').value.toUpperCase(),
            modelo: document.getElementById('modelo').value.toUpperCase(),
            valorPeca: parseFloat(document.getElementById('valorPeca').value) || 0,
            valorOS: parseFloat(document.getElementById('valorOS').value) || 0,
            status: document.getElementById('status').value,
            pagamento: document.getElementById('pagamento').value.toUpperCase(),
            fornecedor: document.getElementById('fornecedor').value.toUpperCase()
        };

        try {
            await addDoc(collection(db, "controle_os"), dados);
            fecharModal();
            carregarDados();
        } catch (error) {
            alert("Erro: " + error.message);
        }
    });

    // Funções Globais
    window.deletarItem = async (id) => {
        if(confirm("Apagar este registro?")) {
            await deleteDoc(doc(db, "controle_os", id));
            carregarDados();
        }
    };

    window.abrirModal = () => {
        document.getElementById('modalRegistro').style.display = 'flex';
        document.getElementById('formOS').reset();
        document.getElementById('data').valueAsDate = new Date(); // Data de hoje automática
    };
    
    window.fecharModal = () => document.getElementById('modalRegistro').style.display = 'none';

    // Inicia tabela
    carregarDados();
</script>

</body>
</html>
