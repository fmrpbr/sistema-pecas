<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS PRO 2026 - Business Intelligence v12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; font-size: 16px; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .view-section { display: none; }
        .active-view { display: block; }
        .active-tab { border-left: 6px solid #2563eb; background: #f1f5f9; color: #2563eb; }
        /* Ajuste de tabela para telas menores */
        .table-container { overflow-x: auto; border-radius: 2rem; }
        th, td { min-width: 100px; padding: 1.25rem !important; }
        .col-forn { min-width: 150px; position: sticky; left: 0; background: white; z-index: 10; font-weight: 900; }
    </style>
</head>
<body class="h-screen overflow-hidden text-slate-900">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black mb-8 italic uppercase tracking-tighter">OS PRO <span class="text-blue-600">2026</span></h2>
            <input type="email" id="loginEmail" placeholder="E-mail" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 border font-bold">
            <input type="password" id="loginPass" placeholder="Senha" class="w-full p-4 bg-slate-50 rounded-2xl mb-8 border font-bold">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-xl hover:bg-blue-700 transition">Acessar Sistema</button>
        </div>
    </div>

    <div id="app" class="flex h-full hidden">
        <aside class="w-72 glass shadow-2xl z-30 flex flex-col border-r border-slate-200">
            <div class="p-10 font-black italic text-2xl tracking-tighter text-slate-800">
                <i class="fa-solid fa-chart-line text-blue-600 mr-2"></i>OS PRO <span class="text-blue-600">v12</span>
            </div>
            
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="mudarVisao('saude')" class="sidebar-btn w-full flex items-center p-5 gap-4 font-bold text-sm uppercase active-tab rounded-2xl">
                    <i class="fa-solid fa-wallet"></i> Saúde & BI
                </button>
                <button onclick="mudarVisao('ordens')" class="sidebar-btn w-full flex items-center p-5 gap-4 font-bold text-sm uppercase text-slate-500 rounded-2xl hover:bg-slate-50">
                    <i class="fa-solid fa-list-check"></i> Ordens de Serviço
                </button>
            </nav>

            <div class="p-8">
                <button onclick="logout()" class="w-full font-black text-red-500 uppercase text-[10px] tracking-widest p-4 rounded-xl border border-red-100 hover:bg-red-50 transition">Sair</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-12">
            
            <section id="view-saude" class="view-section active-view space-y-12">
                <header class="flex justify-between items-end">
                    <div>
                        <h1 class="text-5xl font-black italic tracking-tighter text-slate-900">Business <span class="text-blue-600">Intelligence</span></h1>
                        <p class="text-slate-400 font-bold uppercase text-[10px] mt-2 tracking-widest">Acompanhamento de Lucratividade Real por Mês</p>
                    </div>
                </header>

                <div class="bg-white rounded-[3rem] shadow-2xl border border-slate-100 overflow-hidden">
                    <div class="p-8 border-b bg-slate-50/50 flex justify-between items-center">
                        <h3 class="font-black uppercase text-xs tracking-widest text-slate-500">Matriz de Lucro Líquido 2026</h3>
                        <span class="bg-blue-600 text-white text-[9px] px-3 py-1 rounded-full font-black uppercase">Automático</span>
                    </div>
                    <div class="table-container">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-slate-100/30 text-[10px] font-black uppercase text-slate-400">
                                    <th class="col-forn">Fornecedor</th>
                                    <th>Jan</th><th>Fev</th><th>Mar</th><th>Abr</th><th>Mai</th><th>Jun</th>
                                    <th>Jul</th><th>Ago</th><th>Set</th><th>Out</th><th>Nov</th><th>Dez</th>
                                    <th class="bg-blue-50 text-blue-600">Total Ano</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-matriz-lucro" class="text-sm font-bold divide-y divide-slate-100">
                                </tbody>
                            <tfoot id="footer-matriz-lucro" class="bg-slate-900 text-white font-black text-sm">
                                </tfoot>
                        </table>
                    </div>
                </div>

                <div id="grid-fornecedores" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
            </section>

            <section id="view-ordens" class="view-section space-y-10">
                <header class="flex justify-between items-center">
                    <h2 class="text-3xl font-black italic uppercase tracking-tighter">Gerenciar <span class="text-blue-600">Peças</span></h2>
                    <button onclick="abrirModalOS()" class="bg-blue-600 text-white px-10 py-5 rounded-[2rem] font-black uppercase text-xs shadow-xl">+ Nova Entrada</button>
                </header>
                <div id="tabela-os-container" class="bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-slate-100">
                     </div>
            </section>
        </main>
    </div>

    <div id="modalOS" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-2xl p-10 rounded-[3rem] shadow-3xl">
             <form id="formOS" class="grid grid-cols-1 md:grid-cols-2 gap-6 font-bold">
                 <input type="hidden" id="osId">
                 <div class="md:col-span-2 text-xl font-black uppercase mb-4 border-b pb-4">Detalhes da Peça</div>
                 <input type="date" id="data" class="p-4 bg-slate-50 rounded-xl border" required>
                 <input type="number" id="os" placeholder="Nº OS" class="p-4 bg-slate-50 rounded-xl border" required>
                 <select id="fornecedor" class="p-4 bg-slate-50 rounded-xl border"><option>Aracruz</option><option>Colatina</option><option>Outros</option></select>
                 <input type="text" id="modelo" placeholder="Modelo/Peça" class="p-4 bg-slate-50 rounded-xl border" required>
                 <input type="number" id="valorPeca" step="0.01" placeholder="Custo (R$)" class="p-4 bg-slate-100 rounded-xl border text-red-500 font-black">
                 <input type="number" id="valorOS" step="0.01" placeholder="Venda (R$)" class="p-4 bg-slate-100 rounded-xl border text-emerald-600 font-black">
                 <select id="status" class="p-4 bg-slate-50 rounded-xl border"><option value="Utilizado">Utilizado</option><option value="Devolvida">Devolvida</option></select>
                 <button type="submit" class="md:col-span-2 bg-slate-900 text-white p-5 rounded-2xl font-black uppercase transition hover:bg-black">Gravar OS</button>
                 <button type="button" onclick="fecharModalOS()" class="md:col-span-2 text-slate-400 font-bold uppercase text-[10px]">Cancelar</button>
             </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

        // Configuração Firebase (Sua configuração atual)
        const firebaseConfig = {
            apiKey: "AIzaSyCoN6SK7Erhh5f67vGNwuP_cGA_LGeNm4U",
            authDomain: "controledeos-2de2c.firebaseapp.com",
            projectId: "controledeos-2de2c",
            storageBucket: "controledeos-2de2c.firebasestorage.app",
            messagingSenderId: "1037478732552",
            appId: "1:1037478732552:web:3d32412d5a713c3cc042bd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let todosDados = [];

        // AUTH & CARREGAMENTO
        window.login = async () => {
            try { await signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value); } catch(e) { alert("Erro de acesso."); }
        };
        onAuthStateChanged(auth, u => { if(u) { app.classList.remove('hidden'); auth-screen.classList.add('hidden'); carregarDados(); } });
        window.logout = () => signOut(auth);

        async function carregarDados() {
            const snap = await getDocs(query(collection(db, "controle_os"), orderBy("data", "desc")));
            todosDados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            gerarMatrizBI();
        }

        function gerarMatrizBI() {
            const fornecedores = ['Aracruz', 'Colatina', 'Outros'];
            const mesesLabels = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            
            // Estrutura de dados: { Aracruz: [0,0,0...12], ... }
            let matriz = {};
            fornecedores.forEach(f => matriz[f] = Array(12).fill(0));
            
            let totaisMensais = Array(12).fill(0);

            todosDados.forEach(os => {
                if(os.status === 'Utilizado') {
                    const dataOS = new Date(os.data + "T12:00:00");
                    const mes = dataOS.getMonth();
                    const lucro = (parseFloat(os.valorOS) || 0) - (parseFloat(os.valorPeca) || 0);
                    const fKey = os.fornecedor || 'Outros';

                    if(matriz[fKey]) {
                        matriz[fKey][mes] += lucro;
                        totaisMensais[mes] += lucro;
                    }
                }
            });

            // Renderizar Tabela
            const corpo = document.getElementById('corpo-matriz-lucro');
            corpo.innerHTML = '';
            
            fornecedores.forEach(f => {
                let row = `<tr class="hover:bg-slate-50 transition">
                            <td class="col-forn text-blue-600 uppercase tracking-tighter">${f}</td>`;
                let totalAnoForn = 0;
                
                matriz[f].forEach(valorMes => {
                    row += `<td class="${valorMes < 0 ? 'text-red-500' : 'text-slate-600'}">${fmtMoeda(valorMes)}</td>`;
                    totalAnoForn += valorMes;
                });

                row += `<td class="bg-blue-50 text-blue-700 font-black">${fmtMoeda(totalAnoForn)}</td></tr>`;
                corpo.innerHTML += row;
            });

            // Renderizar Rodapé Totais
            const footer = document.getElementById('footer-matriz-lucro');
            let footRow = `<tr><td class="p-6 col-forn bg-slate-900 text-white uppercase">TOTAL MÊS</td>`;
            let totalGeralAno = 0;
            
            totaisMensais.forEach(v => {
                footRow += `<td class="p-6">${fmtMoeda(v)}</td>`;
                totalGeralAno += v;
            });

            footRow += `<td class="p-6 bg-blue-600 text-white">${fmtMoeda(totalGeralAno)}</td></tr>`;
            footer.innerHTML = footRow;
        }

        window.mudarVisao = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
            document.getElementById('view-' + v).classList.add('active-view');
        };

        // Funções de Modal (Simplificadas)
        window.abrirModalOS = () => { formOS.reset(); osId.value = ''; modalOS.classList.remove('hidden'); };
        window.fecharModalOS = () => modalOS.classList.add('hidden');
        
        document.getElementById('formOS').addEventListener('submit', async (e) => {
            e.preventDefault();
            const d = {
                data: data.value, os: os.value, fornecedor: fornecedor.value, modelo: modelo.value,
                valorPeca: parseFloat(valorPeca.value) || 0, valorOS: parseFloat(valorOS.value) || 0, status: status.value
            };
            await addDoc(collection(db, "controle_os"), d);
            fecharModalOS(); carregarDados();
        });

        const fmtMoeda = (v) => (v||0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0});
    </script>
</body>
</html>
