<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS PRO 2026 - Business Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; font-size: 15px; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .view-section { display: none; }
        .active-view { display: block; }
        .active-tab { border-left: 6px solid #2563eb; background: #f1f5f9; color: #2563eb; }
        .table-container { overflow-x: auto; }
        th, td { min-width: 100px; padding: 1rem !important; }
        .col-forn { min-width: 140px; position: sticky; left: 0; background: inherit; z-index: 10; font-weight: 900; }
        .month-record { background-color: #dcfce7 !important; color: #166534 !important; border: 2px solid #22c55e; }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 transition-opacity duration-500">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-black mb-8 italic uppercase tracking-tighter">OS PRO <span class="text-blue-600">2026</span></h2>
            <input type="email" id="loginEmail" placeholder="E-mail" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 border outline-none focus:ring-2 ring-blue-500 font-bold">
            <input type="password" id="loginPass" placeholder="Senha" class="w-full p-4 bg-slate-50 rounded-2xl mb-8 border outline-none focus:ring-2 ring-blue-500 font-bold">
            <button id="btnLogin" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-xl hover:bg-blue-700 transition active:scale-95">Acessar Sistema</button>
        </div>
    </div>

    <div id="app-content" class="flex h-full hidden">
        <aside class="w-72 glass shadow-2xl z-30 flex flex-col border-r border-slate-200">
            <div class="p-10 font-black italic text-2xl tracking-tighter text-slate-800">
                <i class="fa-solid fa-chart-line text-blue-600 mr-2"></i>OS PRO
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="mudarVisao('saude')" class="sidebar-btn w-full flex items-center p-5 gap-4 font-bold text-sm uppercase active-tab rounded-2xl transition-all">
                    <i class="fa-solid fa-wallet"></i> Saúde & BI
                </button>
                <button onclick="mudarVisao('ordens')" class="sidebar-btn w-full flex items-center p-5 gap-4 font-bold text-sm uppercase text-slate-500 rounded-2xl hover:bg-slate-50 transition-all">
                    <i class="fa-solid fa-list-check"></i> Ordens de Serviço
                </button>
            </nav>
            <div class="p-8 space-y-4">
                <div class="bg-slate-900 p-6 rounded-3xl text-white shadow-2xl">
                    <p class="text-[10px] font-black text-blue-400 uppercase mb-2 tracking-widest">Diagnóstico IA</p>
                    <div id="ai-insight" class="text-[11px] italic opacity-80 leading-tight">Analizando lucros...</div>
                </div>
                <button id="btnLogout" class="w-full font-black text-red-500 uppercase text-[10px] tracking-widest p-4 rounded-xl hover:bg-red-50 transition">Sair</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-12 bg-[#f1f5f9]">
            <section id="view-saude" class="view-section active-view space-y-10">
                <header class="flex justify-between items-end">
                    <h1 class="text-5xl font-black italic tracking-tighter text-slate-900">Métricas <span class="text-blue-600">Reais</span></h1>
                </header>

                <div class="bg-white rounded-[3rem] shadow-2xl border border-slate-200 overflow-hidden">
                    <div class="p-8 border-b bg-slate-50 flex justify-between items-center">
                        <h3 class="font-black uppercase text-xs tracking-widest text-slate-500">Matriz de Lucro Líquido por Fornecedor</h3>
                        <span class="text-[10px] text-emerald-600 font-bold"><i class="fa-solid fa-check-double"></i> Atualizado em tempo real</span>
                    </div>
                    <div class="table-container">
                        <table class="w-full text-left">
                            <thead class="bg-slate-100/50 text-[10px] font-black uppercase text-slate-400">
                                <tr id="header-meses">
                                    <th class="col-forn">Fornecedor</th>
                                    <th>Jan</th><th>Fev</th><th>Mar</th><th>Abr</th><th>Mai</th><th>Jun</th>
                                    <th>Jul</th><th>Ago</th><th>Set</th><th>Out</th><th>Nov</th><th>Dez</th>
                                    <th class="bg-blue-600 text-white">Ano Total</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-matriz-lucro" class="text-sm font-bold divide-y divide-slate-100"></tbody>
                            <tfoot id="footer-matriz-lucro" class="bg-slate-900 text-white font-black"></tfoot>
                        </table>
                    </div>
                </div>
            </section>

            <section id="view-ordens" class="view-section space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black uppercase italic italic">Registros <span class="text-blue-600">Gerais</span></h2>
                    <button onclick="abrirModalOS()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-xs shadow-xl transition-transform hover:scale-105">+ Nova OS</button>
                </div>
                <div class="bg-white rounded-[2.5rem] shadow-xl border overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 font-black uppercase text-slate-400 border-b">
                            <tr><th class="p-6">Data</th><th class="p-6">OS</th><th class="p-6">Fornecedor</th><th class="p-6">Modelo</th><th class="p-6">Lucro</th><th class="p-6">Ação</th></tr>
                        </thead>
                        <tbody id="tabela-os-geral" class="divide-y font-semibold"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modalOS" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-xl p-10 rounded-[3rem] shadow-3xl">
            <form id="formOS" class="grid grid-cols-2 gap-6 font-bold">
                <div class="col-span-2 text-xl font-black uppercase mb-4 border-b pb-4 italic">Detalhes da Ordem</div>
                <input type="date" id="data" class="p-4 bg-slate-50 rounded-xl border" required>
                <input type="number" id="os" placeholder="Nº OS" class="p-4 bg-slate-50 rounded-xl border" required>
                <select id="fornecedor" class="p-4 bg-slate-50 rounded-xl border"><option>Aracruz</option><option>Colatina</option><option>Outros</option></select>
                <input type="text" id="modelo" placeholder="Modelo/Peça" class="p-4 bg-slate-50 rounded-xl border" required>
                <input type="number" id="valorPeca" step="0.01" placeholder="Custo (R$)" class="p-4 bg-slate-50 rounded-xl border text-red-500">
                <input type="number" id="valorOS" step="0.01" placeholder="Venda (R$)" class="p-4 bg-slate-50 rounded-xl border text-emerald-600">
                <button type="submit" class="col-span-2 bg-blue-600 text-white p-5 rounded-2xl font-black uppercase transition hover:bg-blue-700 shadow-xl">Salvar Registro</button>
                <button type="button" onclick="fecharModalOS()" class="col-span-2 text-slate-400 font-black uppercase text-[10px]">Fechar</button>
            </form>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const firebaseConfig = {
        apiKey: "AIzaSyCoN6SK7Erhh5f67vGNwuP_cGA_LGeNm4U",
        authDomain: "controledeos-2de2c.firebaseapp.com",
        projectId: "controledeos-2de2c",
        storageBucket: "controledeos-2de2c.firebasestorage.app",
        messagingSenderId: "1037478732552",
        appId: "1:1037478732552:web:3d32412d5a713c3cc042bd",
        measurementId: "G-FQ94ZVSLF5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const genAI = new GoogleGenerativeAI("AIzaSyCha6XRWgfXY1PxtreksvS_rP4SLBF9nh0");

    let todosDados = [];

    // --- CORREÇÃO DO LOGIN ---
    const login = async () => {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        if(!email || !pass) return alert("Preencha todos os campos");
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch(e) {
            alert("Erro de autenticação: Verifique e-mail e senha.");
        }
    };
    document.getElementById('btnLogin').addEventListener('click', login);
    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        const screen = document.getElementById('auth-screen');
        const content = document.getElementById('app-content');
        if (user) {
            screen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { screen.classList.add('hidden'); content.classList.remove('hidden'); }, 500);
            carregarDados();
        } else {
            screen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            content.classList.add('hidden');
        }
    });

    // --- CARREGAMENTO E BI ---
    async function carregarDados() {
        const snap = await getDocs(query(collection(db, "controle_os"), orderBy("data", "desc")));
        todosDados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        gerarMatrizBI();
        renderizarTabelaOS();
    }

    function gerarMatrizBI() {
        const fornecedores = ['Aracruz', 'Colatina', 'Outros'];
        let matriz = {};
        fornecedores.forEach(f => matriz[f] = Array(12).fill(0));
        let totaisMensais = Array(12).fill(0);

        todosDados.forEach(os => {
            const dataOS = new Date(os.data + "T12:00:00");
            const mes = dataOS.getMonth();
            const lucro = (parseFloat(os.valorOS) || 0) - (parseFloat(os.valorPeca) || 0);
            const fKey = os.fornecedor || 'Outros';
            if(matriz[fKey]) {
                matriz[fKey][mes] += lucro;
                totaisMensais[mes] += lucro;
            }
        });

        // Encontrar mês recorde
        const valorMaximo = Math.max(...totaisMensais);
        const indexRecorde = totaisMensais.indexOf(valorMaximo);

        // Renderizar Tabela
        const corpo = document.getElementById('corpo-matriz-lucro');
        corpo.innerHTML = '';
        fornecedores.forEach(f => {
            let row = `<tr class="hover:bg-slate-50 transition"><td class="col-forn text-blue-600 uppercase border-r bg-white">${f}</td>`;
            let totalForn = 0;
            matriz[f].forEach((v, idx) => {
                const isRecord = (idx === indexRecorde && valorMaximo > 0);
                row += `<td class="${isRecord ? 'month-record' : ''}">${fmtMoeda(v)}</td>`;
                totalForn += v;
            });
            row += `<td class="bg-blue-50 text-blue-700 font-black border-l">${fmtMoeda(totalForn)}</td></tr>`;
            corpo.innerHTML += row;
        });

        // Rodapé
        const footer = document.getElementById('footer-matriz-lucro');
        let footRow = `<tr class="bg-slate-900 text-white"><td class="p-6 col-forn">TOTAL</td>`;
        totaisMensais.forEach((v, idx) => {
            const isRecord = (idx === indexRecorde && valorMaximo > 0);
            footRow += `<td class="p-6 ${isRecord ? 'bg-emerald-500' : ''}">${isRecord ? '⭐ ' : ''}${fmtMoeda(v)}</td>`;
        });
        footRow += `<td class="p-6 bg-blue-700">${fmtMoeda(totaisMensais.reduce((a,b)=>a+b,0))}</td></tr>`;
        footer.innerHTML = footRow;

        atualizarIA(totaisMensais, fornecedores, matriz);
    }

    function renderizarTabelaOS() {
        const tb = document.getElementById('tabela-os-geral');
        tb.innerHTML = '';
        todosDados.forEach(os => {
            const lucro = (parseFloat(os.valorOS)||0) - (parseFloat(os.valorPeca)||0);
            tb.innerHTML += `
                <tr class="hover:bg-blue-50/20 transition">
                    <td class="p-6 text-slate-400 font-bold">${new Date(os.data + "T12:00:00").toLocaleDateString('pt-BR')}</td>
                    <td class="p-6 font-black italic">#${os.os}</td>
                    <td class="p-6 font-bold text-blue-600">${os.fornecedor}</td>
                    <td class="p-6 text-slate-700">${os.modelo}</td>
                    <td class="p-6 font-black text-emerald-600">${fmtMoeda(lucro)}</td>
                    <td class="p-6"><button onclick="deletarOS('${os.id}')" class="text-red-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
        });
    }

    // --- INTEGRAÇÃO IA ---
    async function atualizarIA(totais, nomesForn, matriz) {
        const out = document.getElementById('ai-insight');
        try {
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const prompt = `Analise financeiramente: Fornecedores ${nomesForn.join(',')}. 
            Lucro Total: ${totais.reduce((a,b)=>a+b,0)}. 
            Identifique qual fornecedor é mais rentável baseado no lucro e dê um conselho estratégico curto.`;
            const result = await model.generateContent(prompt);
            out.innerHTML = `<i class="fa-solid fa-robot mr-1"></i> ${result.response.text()}`;
        } catch(e) { out.innerText = "Aguardando volume de dados..."; }
    }

    // --- EVENTOS ---
    document.getElementById('formOS').addEventListener('submit', async (e) => {
        e.preventDefault();
        const d = {
            data: document.getElementById('data').value,
            os: document.getElementById('os').value,
            fornecedor: document.getElementById('fornecedor').value,
            modelo: document.getElementById('modelo').value,
            valorPeca: parseFloat(document.getElementById('valorPeca').value) || 0,
            valorOS: parseFloat(document.getElementById('valorOS').value) || 0,
            status: 'Utilizado'
        };
        await addDoc(collection(db, "controle_os"), d);
        fecharModalOS(); carregarDados();
    });

    window.deletarOS = async (id) => {
        if(confirm("Excluir este registro permanentemente?")) {
            await deleteDoc(doc(db, "controle_os", id));
            carregarDados();
        }
    }

    window.mudarVisao = (v) => {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
        document.getElementById('view-' + v).classList.add('active-view');
        document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active-tab', 'text-slate-400'));
        event.currentTarget.classList.add('active-tab');
    };
    window.abrirModalOS = () => document.getElementById('modalOS').classList.remove('hidden');
    window.fecharModalOS = () => document.getElementById('modalOS').classList.add('hidden');
    const fmtMoeda = (v) => (v||0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL', minimumFractionDigits: 0});
</script>
</body>
</html>
