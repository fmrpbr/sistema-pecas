<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão OS Pro v4.8 - Powered by Gemini 3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; font-size: 13px; }
        .sidebar-active { background-color: #f8fafc; color: #2563eb; border-right: 3px solid #2563eb; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .compact-table th { padding: 6px 12px !important; background: #f8fafc; color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .compact-table td { padding: 8px 12px !important; border-bottom: 1px solid #f1f5f9; }
        .ai-pill { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); transition: all 0.4s ease; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-700">

    <div id="auth-screen" class="fixed inset-0 z-[5000] flex items-center justify-center bg-slate-900 text-slate-800">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-lg font-black uppercase tracking-widest mb-6 italic">Controle OS Pro</h1>
            <form id="authForm" class="space-y-3">
                <input type="email" id="authEmail" class="w-full p-2.5 border rounded-lg outline-none" required placeholder="E-mail">
                <input type="password" id="authPass" class="w-full p-2.5 border rounded-lg outline-none" required placeholder="Senha">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg hover:bg-black transition uppercase text-[10px]">Acessar Painel</button>
            </form>
        </div>
    </div>

    <div id="app-content" class="hidden h-screen flex overflow-hidden">
        <aside class="w-52 bg-white border-r flex flex-col no-print">
            <div class="p-6 text-slate-900 font-black text-base flex items-center gap-2 italic">
                <i class="fa-solid fa-bolt text-blue-600"></i> OS PRO v4.8
            </div>
            <nav class="flex-1 space-y-1">
                <a href="#" onclick="mudarVisao('dashboard', this)" class="sidebar-active flex items-center px-6 py-3 gap-3 font-bold text-xs uppercase">
                    <i class="fa-solid fa-grid-2"></i> Painel
                </a>
                <a href="#" onclick="mudarVisao('relatorios', this)" class="flex items-center px-6 py-3 gap-3 text-slate-400 hover:bg-slate-50 text-xs font-bold uppercase transition-all">
                    <i class="fa-solid fa-truck"></i> Fornecedores
                </a>
                <a href="#" onclick="mudarVisao('pesquisa', this)" class="flex items-center px-6 py-3 gap-3 text-slate-400 hover:bg-slate-50 text-xs font-bold uppercase transition-all">
                    <i class="fa-solid fa-search"></i> Buscar Peça
                </a>
            </nav>

            <div class="px-4 mb-4">
                <div class="ai-pill p-4 rounded-xl text-white shadow-lg relative overflow-hidden">
                    <div id="aiRiskIndicator" class="absolute top-0 right-0 w-1 h-full bg-emerald-500"></div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[8px] font-black uppercase tracking-widest text-blue-400">Gemini 3 Flash</span>
                        <button onclick="analisarComIA()" class="hover:text-blue-400 transition-colors"><i class="fa-solid fa-bolt text-[10px]"></i></button>
                    </div>
                    <div id="smartAnalysisText" class="text-[10px] leading-tight opacity-70 italic font-medium">IA pronta para análise.</div>
                </div>
            </div>

            <div class="p-4 border-t bg-slate-50 text-center">
                <button onclick="logout()" class="text-[9px] bg-red-50 text-red-500 font-black px-3 py-1 rounded-full uppercase border border-red-100">Sair</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6">
            <div id="view-dashboard" class="view-section active space-y-6">
                <header class="flex justify-between items-center">
                    <h2 class="font-black text-slate-800 uppercase italic">Monitoramento Geral</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="gerarPDFRelatorio()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-slate-300 transition">
                            <i class="fa-solid fa-file-pdf mr-1"></i> Exportar PDF
                        </button>
                        <button onclick="abrirModal()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-blue-700 shadow-lg">+ Novo Pedido</button>
                    </div>
                </header>

                <div class="grid grid-cols-3 gap-4">
                    <div id="cardAracruz" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-slate-300">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Pendente Aracruz</span>
                        <h3 id="abertoAracruz" class="text-xl font-black text-slate-800 italic mt-1 font-mono">R$ 0,00</h3>
                    </div>
                    <div id="cardColatina" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-slate-300">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Pendente Colatina</span>
                        <h3 id="abertoColatina" class="text-xl font-black text-slate-800 italic mt-1 font-mono">R$ 0,00</h3>
                    </div>
                    <div id="cardOutros" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-slate-300">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Outros Pendentes</span>
                        <h3 id="abertoOutros" class="text-xl font-black text-slate-800 italic mt-1 font-mono">R$ 0,00</h3>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 italic">Evolução de Faturamento</h3>
                    <canvas id="graficoFaturamento" height="80"></canvas>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full compact-table">
                            <thead>
                                <tr><th>OS</th><th>Fornecedor</th><th>Modelo</th><th>Data</th><th>Venda</th><th>Status</th><th class="text-right">Ação</th></tr>
                            </thead>
                            <tbody id="tabelaDashboard" class="text-xs font-medium"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            </main>
    </div>

<script type="module">
    // Importações e Configurações (Permanecem iguais ao seu arquivo original)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const firebaseConfig = { /* Suas chaves aqui */ };
    const genAI = new GoogleGenerativeAI("AIzaSyDCy3mPyBKhVKt8tY2NHcEnyJ9YaqpgbLA");
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let todosDados = [];
    let meuGrafico;

    onAuthStateChanged(auth, (u) => {
        if(u) { carregarDados(); }
    });

    async function carregarDados() {
        const snapshot = await getDocs(query(collection(db, "controle_os"), orderBy("data", "desc")));
        todosDados = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        
        atualizarSaldosInteligentes();
        renderizarTabelaPrincipal();
        atualizarGrafico(); // Integrado
    }

    // 1. FUNÇÃO GERAR PDF
    window.gerarPDFRelatorio = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text("Relatório de Ordens de Serviço - OS PRO", 14, 20);
        
        const dadosTabela = todosDados.map(i => [
            i.os, i.fornecedor, i.modelo, 
            new Date(i.data + "T12:00:00").toLocaleDateString('pt-BR'), 
            i.status, fmtMoeda(i.valorOS)
        ]);

        doc.autoTable({
            head: [['OS', 'Fornecedor', 'Modelo', 'Data', 'Status', 'Valor Venda']],
            body: dadosTabela,
            startY: 30,
            theme: 'striped'
        });
        doc.save(`relatorio-os-${new Date().toLocaleDateString()}.pdf`);
    };

    // 2. FUNÇÃO ATUALIZAR GRÁFICO
    function atualizarGrafico() {
        const canvas = document.getElementById('graficoFaturamento');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const meses = [...new Set(todosDados.map(i => i.data.substring(0, 7)))].sort();
        const valores = meses.map(mes => {
            return todosDados.filter(i => i.data.startsWith(mes) && i.status === 'FINALIZADO')
                             .reduce((acc, curr) => acc + (parseFloat(curr.valorOS) || 0), 0);
        });

        if (meuGrafico) meuGrafico.destroy();
        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: meses.map(m => m.split('-').reverse().join('/')),
                datasets: [{
                    label: 'Faturamento Mensal',
                    data: valores,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    // Utilitários e outras funções CRUD aqui...
    const fmtMoeda = (v) => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
</script>
</body>
</html>
