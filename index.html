<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão OS Pro v4.8 - Powered by Gemini 3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; font-size: 13px; }
        .sidebar-active { background-color: #f8fafc; color: #2563eb; border-right: 3px solid #2563eb; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .compact-table th { padding: 6px 12px !important; background: #f8fafc; color: #94a3b8; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .compact-table td { padding: 8px 12px !important; border-bottom: 1px solid #f1f5f9; }
        .ai-pill { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); transition: all 0.4s ease; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-700">

    <div id="auth-screen" class="fixed inset-0 z-[5000] flex items-center justify-center bg-slate-900 text-slate-800">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h1 class="text-lg font-black uppercase tracking-widest mb-6 italic">Controle OS Pro</h1>
            <form id="authForm" class="space-y-3">
                <input type="email" id="authEmail" class="w-full p-2.5 border rounded-lg outline-none" required placeholder="E-mail">
                <input type="password" id="authPass" class="w-full p-2.5 border rounded-lg outline-none" required placeholder="Senha">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg hover:bg-black transition uppercase text-[10px]">Acessar Painel</button>
            </form>
        </div>
    </div>

    <div id="app-content" class="hidden h-screen flex overflow-hidden">
        <aside class="w-52 bg-white border-r flex flex-col no-print">
            <div class="p-6 text-slate-900 font-black text-base flex items-center gap-2 italic">
                <i class="fa-solid fa-bolt text-blue-600"></i> OS PRO v4.8
            </div>
            <nav class="flex-1 space-y-1 text-sm">
                <a href="#" onclick="mudarVisao('dashboard', this)" class="sidebar-active flex items-center px-6 py-3 gap-3 font-bold text-xs uppercase"><i class="fa-solid fa-grid-2"></i> Painel</a>
                <a href="#" onclick="mudarVisao('relatorios', this)" class="flex items-center px-6 py-3 gap-3 text-slate-400 hover:bg-slate-50 text-xs font-bold uppercase transition-all"><i class="fa-solid fa-truck"></i> Fornecedores</a>
                <a href="#" onclick="mudarVisao('pesquisa', this)" class="flex items-center px-6 py-3 gap-3 text-slate-400 hover:bg-slate-50 text-xs font-bold uppercase transition-all"><i class="fa-solid fa-search"></i> Buscar Peça</a>
            </nav>

            <div class="px-4 mb-4">
                <div class="ai-pill p-4 rounded-xl text-white shadow-lg relative overflow-hidden">
                    <div id="aiRiskIndicator" class="absolute top-0 right-0 w-1 h-full bg-emerald-500"></div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[8px] font-black uppercase tracking-widest text-blue-400">Gemini 3 Flash</span>
                        <button onclick="analisarComIA()" class="hover:text-blue-400"><i class="fa-solid fa-bolt text-[10px]"></i></button>
                    </div>
                    <div id="smartAnalysisText" class="text-[10px] leading-tight opacity-70 italic font-medium">IA pronta para análise.</div>
                </div>
            </div>

            <div class="p-4 border-t bg-slate-50 text-center">
                <button onclick="logout()" class="text-[9px] bg-red-50 text-red-500 font-black px-3 py-1 rounded-full uppercase border border-red-100">Sair</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-6">
            <div id="view-dashboard" class="view-section active space-y-6">
                <header class="flex justify-between items-center">
                    <h2 class="font-black text-slate-800 uppercase italic">Painel de Gestão</h2>
                    <button onclick="abrirModal()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-blue-700 shadow-lg">+ Novo Pedido</button>
                </header>

                <div class="grid grid-cols-3 gap-4">
                    <div id="cardAracruz" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter italic">Pendente Aracruz</span>
                        <h3 id="abertoAracruz" class="text-xl font-black text-slate-800 mt-1">R$ 0,00</h3>
                    </div>
                    <div id="cardColatina" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter italic">Pendente Colatina</span>
                        <h3 id="abertoColatina" class="text-xl font-black text-slate-800 mt-1">R$ 0,00</h3>
                    </div>
                    <div id="cardOutros" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter italic">Outros</span>
                        <h3 id="abertoOutros" class="text-xl font-black text-slate-800 mt-1">R$ 0,00</h3>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-slate-900 p-4 rounded-xl text-white shadow-xl">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Lucro Mês</p>
                        <h3 id="dashLucro" class="text-2xl font-black text-emerald-400 italic">R$ 0,00</h3>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200"><p class="text-[9px] font-black text-slate-400 uppercase">Ativas</p><h3 id="dashTotalEncomendas" class="text-xl font-bold">0</h3></div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200"><p class="text-[9px] font-black text-slate-400 uppercase">Faturamento</p><h3 id="dashFat" class="text-xl font-bold">R$ 0,00</h3></div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 border-l-4 border-l-red-500"><p class="text-[9px] font-black text-red-500 uppercase">Dívida Total</p><h3 id="dashDivida" class="text-xl font-black text-red-600">R$ 0,00</h3></div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table class="w-full compact-table">
                        <tbody id="tabelaDashboard" class="text-xs font-medium"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="modalRegistro" class="modal fixed inset-0 z-[6000] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 text-slate-800">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50"><h3 class="font-black text-xs uppercase italic">Detalhes da Ordem</h3><button onclick="fecharModais()"><i class="fa-solid fa-xmark"></i></button></div>
            <form id="formOS" class="p-6 grid grid-cols-2 gap-4">
                <input type="hidden" id="editId">
                <div class="col-span-2"><label class="text-[9px] font-black uppercase text-slate-400">Modelo / Peça</label><input type="text" id="modelo" class="w-full p-2 bg-slate-50 border rounded-lg outline-none" required></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">Data</label><input type="date" id="data" class="w-full p-2 bg-slate-50 border rounded-lg" required></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">OS Nº</label><input type="number" id="os" class="w-full p-2 bg-slate-50 border rounded-lg" required></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">Fornecedor</label><select id="fornecedor" class="w-full p-2 bg-slate-50 border rounded-lg"><option value="Aracruz">Aracruz</option><option value="Colatina">Colatina</option><option value="Outros">Outros</option></select></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">Status</label><select id="status" class="w-full p-2 bg-slate-50 border rounded-lg"><option value="ENCOMENDA">ENCOMENDA</option><option value="FINALIZADO">FINALIZADO</option><option value="DEVOLUÇÃO">DEVOLUÇÃO</option></select></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">Custo (R$)</label><input type="number" id="valorPeca" class="w-full p-2 bg-slate-50 border rounded-lg font-bold" step="0.01"></div>
                <div><label class="text-[9px] font-black uppercase text-slate-400">Venda (R$)</label><input type="number" id="valorOS" class="w-full p-2 bg-slate-50 border rounded-lg font-bold" step="0.01"></div>
                <div class="col-span-2 pt-4"><button type="submit" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-widest shadow-lg">Salvar Lançamento</button></div>
            </form>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    const firebaseConfig = {
        apiKey: "AIzaSyCoN6SK7Erhh5f67vGNwuP_cGA_LGeNm4U",
        authDomain: "controledeos-2de2c.firebaseapp.com",
        projectId: "controledeos-2de2c",
        storageBucket: "controledeos-2de2c.firebasestorage.app",
        messagingSenderId: "1037478732552",
        appId: "1:1037478732552:web:3d32412d5a713c3cc042bd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const genAI = new GoogleGenerativeAI("AIzaSyDCy3mPyBKhVKt8tY2NHcEnyJ9YaqpgbLA");

    let todosDados = [];

    onAuthStateChanged(auth, (u) => {
        if(u) { document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); carregarDados(); }
        else { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('app-content').classList.add('hidden'); }
    });

    async function carregarDados() {
        const snapshot = await getDocs(query(collection(db, "controle_os"), orderBy("data", "desc")));
        todosDados = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        atualizarSaldosInteligentes();
        atualizarDashboard();
        renderizarTabelaPrincipal();
    }

    function atualizarDashboard() {
        let fat=0, luc=0, enc=0;
        const hoje = new Date();
        todosDados.forEach(i => {
            if(i.status === 'ENCOMENDA') enc++;
            const dt = new Date(i.data + "T12:00:00");
            if(dt.getMonth() === hoje.getMonth() && i.status === 'FINALIZADO') { 
                fat += (parseFloat(i.valorOS) || 0); 
                luc += (parseFloat(i.valorOS) || 0) - (parseFloat(i.valorPeca) || 0); 
            }
        });
        document.getElementById('dashTotalEncomendas').innerText = enc;
        document.getElementById('dashFat').innerText = fmtMoeda(fat);
        document.getElementById('dashLucro').innerText = fmtMoeda(luc);
    }

    function atualizarSaldosInteligentes() {
        const saldos = { Aracruz: 0, Colatina: 0, Outros: 0 };
        todosDados.forEach(i => {
            if (i.status === 'DEVOLUÇÃO') return;
            let jaP = 0; if (i.historicoPagamentos) i.historicoPagamentos.forEach(p => jaP += parseFloat(p.valor));
            const div = Math.max(0, (parseFloat(i.valorPeca) || 0) - jaP);
            if (saldos[i.fornecedor] !== undefined) saldos[i.fornecedor] += div; else saldos.Outros += div;
        });

        const totalGeral = saldos.Aracruz + saldos.Colatina + saldos.Outros;
        document.getElementById('dashDivida').innerText = fmtMoeda(totalGeral);

        const applyAlert = (id, val) => {
            const card = document.getElementById('card'+id);
            document.getElementById('aberto'+id).innerText = fmtMoeda(val);
            card.className = val > 1500 ? "bg-red-50 p-4 rounded-xl border border-red-200 border-l-8 border-l-red-600 shadow-lg status-pulse" : 
                             val > 800 ? "bg-orange-50 p-4 rounded-xl border border-orange-200 border-l-8 border-l-orange-400 shadow-md" : 
                             "bg-white p-4 rounded-xl border border-slate-200 border-l-8 border-l-emerald-400 shadow-sm";
        };
        applyAlert('Aracruz', saldos.Aracruz); applyAlert('Colatina', saldos.Colatina); applyAlert('Outros', saldos.Outros);

        // Alerta Visual IA (Lado Esquerdo)
        const riskBar = document.getElementById('aiRiskIndicator');
        if(totalGeral > 2000) riskBar.className = "absolute top-0 right-0 w-2 h-full bg-red-600 status-pulse";
        else if(totalGeral > 1000) riskBar.className = "absolute top-0 right-0 w-2 h-full bg-orange-400";
        else riskBar.className = "absolute top-0 right-0 w-2 h-full bg-emerald-500";
    }

    function renderizarTabelaPrincipal() {
        const tb = document.getElementById('tabelaDashboard'); tb.innerHTML = ''; let mesRef = "";
        todosDados.forEach(i => {
            const dt = new Date(i.data + "T12:00:00"); const mO = dt.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).toUpperCase();
            if(mO !== mesRef) { mesRef = mO; tb.innerHTML += `<tr class="bg-slate-50"><td colspan="7" class="px-4 py-1 text-[9px] font-black text-slate-300 tracking-widest">${mO}</td></tr>`; }
            tb.innerHTML += `<tr class="hover:bg-blue-50/20 transition"><td class="font-black text-slate-300 italic text-[11px]">#${i.os}</td><td class="text-slate-400 font-bold">${i.fornecedor}</td><td class="font-semibold text-slate-800">${i.modelo}</td><td class="text-slate-400">${dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}</td><td class="font-bold text-slate-900">${fmtMoeda(parseFloat(i.valorOS))}</td><td class="text-[9px] font-black uppercase ${i.status === 'FINALIZADO' ? 'text-emerald-500' : 'text-blue-500'}">${i.status}</td><td class="text-right"><button onclick="editarItem('${i.id}')" class="text-slate-300 hover:text-blue-500"><i class="fa-solid fa-pen-to-square"></i></button></td></tr>`;
        });
    }

    window.analisarComIA = async () => {
        const out = document.getElementById('smartAnalysisText'); out.innerHTML = "<i class='fa-solid fa-microchip fa-spin'></i>";
        try {
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const prompt = `Analise financeiramente: ${JSON.stringify(todosDados.slice(0,12))}. Resuma em 2 frases sobre lucro e fornecedores perigosos em português. Use HTML <b>.`;
            const res = await model.generateContent(prompt);
            out.innerHTML = res.response.text();
        } catch(e) { out.innerText = "IA indisponível."; }
    };

    window.editarItem = (id) => {
        const i = todosDados.find(x => x.id === id); if(!i) return;
        document.getElementById('editId').value = id; document.getElementById('modelo').value = i.modelo; document.getElementById('data').value = i.data;
        document.getElementById('os').value = i.os; document.getElementById('fornecedor').value = i.fornecedor; document.getElementById('status').value = i.status;
        document.getElementById('valorPeca').value = i.valorPeca; document.getElementById('valorOS').value = i.valorOS;
        document.getElementById('modalRegistro').style.display = 'flex';
    };

    const fmtMoeda = (v) => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    window.fecharModais = () => document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
</script>
</body>
</html>
