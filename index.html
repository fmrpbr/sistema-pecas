<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS PRO 2026 - Master BI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .sidebar-item:hover { transform: translateX(5px); }
        .active-tab { border-left: 4px solid #2563eb; background: #f1f5f9; color: #2563eb; }
        .view-section { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 h-screen overflow-hidden text-slate-800">

    <div id="app" class="flex h-full">
        <aside class="w-64 glass shadow-2xl z-30 flex flex-col">
            <div class="p-8 text-2xl font-black italic tracking-tighter text-blue-600">
                <i class="fa-solid fa-bolt-lightning"></i> OS PRO
            </div>
            
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="mudarVisao('saude')" class="sidebar-item w-full flex items-center p-4 gap-3 font-bold text-xs uppercase tracking-widest transition-all active-tab">
                    <i class="fa-solid fa-chart-line"></i> Saúde Financeira
                </button>
                <button onclick="mudarVisao('ordens')" class="sidebar-item w-full flex items-center p-4 gap-3 font-bold text-xs uppercase tracking-widest transition-all text-slate-400">
                    <i class="fa-solid fa-clipboard-list"></i> Ordens de Serviço
                </button>
            </nav>

            <div class="p-6 border-t border-slate-200">
                <div id="ia-status" class="bg-slate-900 p-4 rounded-2xl text-[10px] text-blue-300">
                    <p class="font-black uppercase mb-1">Status da IA</p>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Ativa & Analisando
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-10 relative">
            
            <section id="view-saude" class="view-section active-view space-y-10">
                <header class="flex justify-between items-end">
                    <div>
                        <h1 class="text-4xl font-black italic uppercase">Business Intelligence</h1>
                        <p class="text-slate-400 font-bold uppercase text-[11px] tracking-[0.3em]">Gestão Estratégica 2026</p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="abrirModal()" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black uppercase text-xs shadow-xl hover:bg-blue-700 transition">Novo Lançamento</button>
                    </div>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="glass p-8 rounded-[2rem] shadow-sm">
                        <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Lucro Líquido</p>
                        <h2 id="total-lucro" class="text-4xl font-black mt-2 text-emerald-600">R$ 0,00</h2>
                    </div>
                    <div class="glass p-8 rounded-[2rem] shadow-sm">
                        <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Dívida Ativa</p>
                        <h2 id="total-divida" class="text-4xl font-black mt-2 text-red-500">R$ 0,00</h2>
                    </div>
                    <div class="bg-slate-900 p-8 rounded-[2rem] shadow-2xl text-white">
                        <p class="text-xs font-black text-blue-400 uppercase tracking-widest">Insight da IA</p>
                        <div id="ai-insight" class="mt-3 text-xs italic opacity-80 leading-relaxed">
                            Analise seus dados para gerar o relatório estratégico de hoje.
                        </div>
                    </div>
                </div>
            </section>

            <section id="view-ordens" class="view-section space-y-6">
                <h2 class="text-2xl font-black uppercase italic">Histórico de Encomendas</h2>
                <div class="glass rounded-3xl overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-white/50 font-black uppercase text-slate-400">
                            <tr><th class="p-6">Data</th><th class="p-6">OS</th><th class="p-6">Forn.</th><th class="p-6">Peça</th><th class="p-6">Status</th></tr>
                        </thead>
                        <tbody id="tabela-os"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg p-10 rounded-[3rem] shadow-3xl">
            <h3 class="text-2xl font-black italic uppercase mb-6">Lançar Ordem</h3>
            <button onclick="fecharModal()" class="w-full bg-slate-100 py-4 rounded-2xl font-bold uppercase text-xs">Fechar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
