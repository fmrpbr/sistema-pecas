<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Peças | RePhone Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --green: #16a34a; --red: #dc2626; --orange: #ea580c; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        
        /* Layout Grid */
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-weight: 800; font-size: 24px; }
        
        /* Dashboard Cards */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h3 { font-size: 14px; color: #64748b; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .card .value { font-size: 28px; font-weight: 800; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-orange { color: var(--orange); }

        /* Tabela */
        .table-container { background: var(--card); border-radius: 12px; padding: 20px; overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { font-weight: 800; color: #64748b; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #f8fafc; }
        
        /* Status Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .bg-estoque { background: #dbeafe; color: #1e40af; }
        .bg-vendido { background: #dcfce7; color: #166534; }
        .bg-devolucao { background: #fee2e2; color: #991b1b; }
        .bg-garantia { background: #ffedd5; color: #9a3412; }

        /* Botões e Formulário */
        .btn { cursor: pointer; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: var(--red); color: white; padding: 5px 10px; font-size: 12px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 Controle de Peças & Lucro</h1>
        <button onclick="abrirModal()" class="btn btn-primary">+ Nova Encomenda/Peça</button>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h3>Custo Total (Mês Atual)</h3>
            <div class="value text-red" id="dashCusto">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Lucro Estimado (Mês Atual)</h3>
            <div class="value text-green" id="dashLucro">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Ticket Médio (Venda)</h3>
            <div class="value" id="dashMedia">R$ 0,00</div>
        </div>
        <div class="card">
            <h3>Peças em Garantia/Dev.</h3>
            <div class="value text-orange" id="dashProblema">0</div>
        </div>
    </div>

    <div class="table-container">
        <h3>Histórico de Peças</h3>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Fornecedor</th>
                    <th>Status</th>
                    <th>Custo</th>
                    <th>Valor Cobrado</th>
                    <th>Lucro</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                </tbody>
        </table>
    </div>
</div>

<div id="modalRegistro" class="modal">
    <div class="modal-content">
        <h2>Registrar Peça</h2>
        <br>
        <form id="formPeca">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Descrição da Peça (Ex: Tela iPhone 11)</label>
                <input type="text" id="desc" required>
            </div>
            <div class="form-group">
                <label>Fornecedor</label>
                <input type="text" id="fornecedor" placeholder="Ex: Aliexpress, Fornecedor SP">
            </div>
            <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Custo da Peça (R$)</label>
                    <input type="number" id="custo" step="0.01" required>
                </div>
                <div>
                    <label>Valor Cobrado/Venda (R$)</label>
                    <input type="number" id="venda" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="encomenda">📦 Encomenda (A chegar)</option>
                    <option value="estoque">🏠 Em Estoque</option>
                    <option value="vendido">✅ Vendido/Instalado</option>
                    <option value="garantia">⚠️ Troca em Garantia</option>
                    <option value="devolucao">🔙 Devolução ao Fornecedor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="dataReg" required>
            </div>
            
            <div class="actions">
                <button type="button" onclick="fecharModal()" class="btn" style="background:#e2e8f0;">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Registro</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // --- COLE SUA CONFIGURAÇÃO DO FIREBASE AQUI ---
    const firebaseConfig = {
        apiKey: "AIzaSyBiN8FqX8UZeyAh1cG2GHZtQWiQH0xPBV4", 
        authDomain: "rephone-a0a80.firebaseapp.com", 
        projectId: "rephone-a0a80", 
        storageBucket: "rephone-a0a80.firebasestorage.app", 
        appId: "1:431497247030:web:a943715e4acc04b8995b97" 
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tabela = document.getElementById('tabelaCorpo');

    // Funções do Modal
    window.abrirModal = () => {
        document.getElementById('modalRegistro').style.display = 'flex';
        document.getElementById('dataReg').valueAsDate = new Date();
        document.getElementById('formPeca').reset();
        document.getElementById('editId').value = "";
    };
    window.fecharModal = () => document.getElementById('modalRegistro').style.display = 'none';

    // Formatar Moeda
    const fmtMoeda = (val) => val.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

    // 1. SALVAR OU EDITAR
    document.getElementById('formPeca').addEventListener('submit', async (e) => {
        e.preventDefault();
        const custo = parseFloat(document.getElementById('custo').value) || 0;
        const venda = parseFloat(document.getElementById('venda').value) || 0;
        const lucro = venda - custo;

        const dados = {
            descricao: document.getElementById('desc').value,
            fornecedor: document.getElementById('fornecedor').value,
            custo: custo,
            venda: venda,
            lucro: lucro,
            status: document.getElementById('status').value,
            data: document.getElementById('dataReg').value
        };

        const editId = document.getElementById('editId').value;

        try {
            if(editId) {
                await updateDoc(doc(db, "pecas", editId), dados);
            } else {
                await addDoc(collection(db, "pecas"), dados);
            }
            fecharModal();
            carregarDados(); // Recarrega a tabela
        } catch (error) {
            alert("Erro ao salvar: " + error.message);
        }
    });

    // 2. CARREGAR DADOS E CALCULAR DASHBOARD
    async function carregarDados() {
        tabela.innerHTML = '<tr><td colspan="8">Carregando...</td></tr>';
        
        const q = query(collection(db, "pecas"), orderBy("data", "desc"));
        const querySnapshot = await getDocs(q);
        
        tabela.innerHTML = '';
        
        // Variáveis para o Dashboard (Mês Atual)
        let totalCusto = 0;
        let totalLucro = 0;
        let totalVendasCount = 0;
        let somaPrecosVenda = 0;
        let countProblemas = 0;

        const dataAtual = new Date();
        const mesAtual = dataAtual.getMonth(); // 0 a 11
        const anoAtual = dataAtual.getFullYear();

        querySnapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;
            
            // Lógica do Dashboard
            const dataItem = new Date(item.data + "T00:00:00"); // Corrige fuso
            if (dataItem.getMonth() === mesAtual && dataItem.getFullYear() === anoAtual) {
                totalCusto += item.custo;
                // Só conta lucro se status for "vendido" ou "estoque" (previsão)
                if(item.status === 'vendido') {
                    totalLucro += item.lucro;
                    totalVendasCount++;
                    somaPrecosVenda += item.venda;
                }
            }
            if(item.status === 'garantia' || item.status === 'devolucao') {
                countProblemas++;
            }

            // Renderizar Tabela
            const row = document.createElement('tr');
            
            // Define cor do badge
            let badgeClass = 'bg-estoque';
            if(item.status === 'vendido') badgeClass = 'bg-vendido';
            if(item.status === 'devolucao') badgeClass = 'bg-devolucao';
            if(item.status === 'garantia') badgeClass = 'bg-garantia';

            row.innerHTML = `
                <td>${dataItem.toLocaleDateString('pt-BR')}</td>
                <td><strong>${item.descricao}</strong></td>
                <td>${item.fornecedor}</td>
                <td><span class="badge ${badgeClass}">${item.status.toUpperCase()}</span></td>
                <td style="color:var(--red)">${fmtMoeda(item.custo)}</td>
                <td style="color:var(--green)">${fmtMoeda(item.venda)}</td>
                <td><strong>${fmtMoeda(item.lucro)}</strong></td>
                <td>
                    <button class="btn btn-danger" onclick="deletarItem('${id}')">🗑️</button>
                </td>
            `;
            tabela.appendChild(row);
        });

        // Atualizar Dashboard na Tela
        document.getElementById('dashCusto').innerText = fmtMoeda(totalCusto);
        document.getElementById('dashLucro').innerText = fmtMoeda(totalLucro);
        document.getElementById('dashProblema').innerText = countProblemas;
        
        // Média
        const media = totalVendasCount > 0 ? (somaPrecosVenda / totalVendasCount) : 0;
        document.getElementById('dashMedia').innerText = fmtMoeda(media);
    }

    // 3. DELETAR
    window.deletarItem = async (id) => {
        if(confirm("Tem certeza que deseja excluir este registro?")) {
            await deleteDoc(doc(db, "pecas", id));
            carregarDados();
        }
    };

    // Iniciar
    carregarDados();
</script>

</body>
</html>
