<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Técnica Pro | Controle de Fornecedores</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; }
        
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .auth-card {
            background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-modern { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 15px; font-size: 14px; transition: 0.3s; }
        .input-modern:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: var(--primary); color: white; transition: 0.2s; font-size: 14px; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .auth-toggle { font-size: 13px; color: var(--primary); margin-top: 20px; cursor: pointer; text-decoration: none; display: block; }

        /* --- LAYOUT PRINCIPAL --- */
        #app-content { display: none; height: 100%; }
        .app-layout { display: grid; grid-template-columns: 260px 1fr; height: 100%; }

        /* SIDEBAR */
        .sidebar { background: white; border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
        .brand { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        .brand i { color: var(--primary); }
        .user-info { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
        
        .menu-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; margin-top: 20px; }
        .menu-item { padding: 12px 15px; color: var(--text-muted); border-radius: 10px; display: flex; align-items: center; gap: 12px; margin-bottom: 5px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .menu-item:hover { background: #f8fafc; color: var(--primary); transform: translateX(3px); }
        .menu-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }

        /* MAIN CONTENT */
        .main { padding: 30px; overflow-y: auto; background: var(--bg-body); height: 100%; position: relative; }
        .header-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; color: #1e293b; }
        .header-subtitle { font-size: 14px; color: #64748b; margin-bottom: 30px; }

        .view-section { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .view-section.active-view { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* DASHBOARD CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); display: flex; flex-direction: column; justify-content: space-between; }
        .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; font-size: 18px; }
        .stat-value { font-size: 28px; font-weight: 800; color: #1e293b; letter-spacing: -1px; }
        .stat-label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 5px; }
        
        /* GRÁFICOS & IA */
        .grid-charts { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; margin-bottom: 30px; }
        .card-box { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); height: 100%; }
        
        /* IA CARD */
        .ai-card { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); color: white; position: relative; overflow: hidden; }
        .ai-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 60%); pointer-events: none; }
        .ai-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .ai-title { font-weight: 700; font-size: 14px; color: #93c5fd; letter-spacing: 0.5px; }
        .ai-content { font-size: 13px; line-height: 1.6; opacity: 0.9; max-height: 300px; overflow-y: auto; }
        .ai-badge { font-size: 10px; background: rgba(59,130,246,0.3); padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(59,130,246,0.5); }

        /* TABELA DE DADOS */
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .tab-group { display: flex; background: #f1f5f9; padding: 4px; border-radius: 10px; gap: 4px; }
        .tab-btn { padding: 8px 16px; border: none; background: transparent; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 7px; font-size: 13px; transition: 0.2s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .table-container { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { text-align: left; padding: 18px 24px; background: #f8fafc; color: #475569; font-weight: 700; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
        td { padding: 16px 24px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 13px; vertical-align: middle; }
        tr:hover { background: #f8fafc; }
        
        /* STATUS E ALERTAS */
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; }
        .status-finalizado { background: #dcfce7; color: #166534; }
        .status-encomenda { background: #dbeafe; color: #1e40af; }
        .status-devolucao { background: #fee2e2; color: #991b1b; }
        .status-garantia { background: #ffedd5; color: #9a3412; }
        .status-credito { background: #ccfbf1; color: #115e59; border: 1px solid #5eead4; }
        .status-pago { background: #16a34a; color: #ffffff; box-shadow: 0 2px 4px rgba(22, 163, 74, 0.3); }

        /* ALERTAS DE TEMPO (Linhas da Tabela) */
        tr.alert-7 td:first-child { border-left: 4px solid #fcd34d; }
        tr.alert-15 td:first-child { border-left: 4px solid #f97316; background-color: #fff7ed; }
        tr.alert-30 td:first-child { border-left: 4px solid #ef4444; background-color: #fef2f2; }
        tr.alert-60 td:first-child { border-left: 4px solid #7f1d1d; background-color: #fef2f2; color: #7f1d1d; font-weight: bold; }

        /* AÇÕES */
        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; margin-right: 5px; }
        .btn-edit { background: #eff6ff; color: var(--primary); }
        .btn-edit:hover { background: var(--primary); color: white; }
        .btn-del { background: #fef2f2; color: var(--danger); }
        .btn-del:hover { background: var(--danger); color: white; }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 700px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 18px; font-weight: 800; color: #0f172a; }
        .close-modal { cursor: pointer; font-size: 20px; color: #94a3b8; transition: 0.2s; }
        .close-modal:hover { color: var(--danger); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        .form-section { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin: 15px 0 10px 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; grid-column: span 2; }

        /* Responsividade */
        @media(max-width: 1024px) { 
            .grid-charts { grid-template-columns: 1fr; } 
        }
        @media(max-width: 768px) { 
            .app-layout { grid-template-columns: 1fr; } 
            .sidebar { display: none; } /* Idealmente adicionar menu mobile */
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-microchip" style="font-size: 40px; color: var(--primary);"></i>
            </div>
            <h2 id="authTitle" style="margin-bottom: 10px; color: #1e293b;">Login Administrativo</h2>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 25px;">Gestão de Assistência Técnica e Fornecedores</p>
            
            <form id="authForm">
                <input type="text" id="authName" class="input-modern" placeholder="Seu Nome" style="display: none;">
                <input type="email" id="authEmail" class="input-modern" placeholder="E-mail" required>
                <input type="password" id="authPass" class="input-modern" placeholder="Senha" required>
                <button type="submit" class="btn-primary" id="btnAuthSubmit">Entrar no Sistema</button>
            </form>
            <a class="auth-toggle" onclick="window.toggleRegister()">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <div id="app-content">
        <div class="app-layout">
            
            <div class="sidebar">
                <div class="brand">
                    <i class="fa-solid fa-layer-group"></i> GESTÃO OS v2.0
                </div>
                <div class="user-info">
                    <i class="fa-regular fa-user-circle"></i>
                    <span id="displayUserName">Usuário</span>
                </div>

                <div class="menu-label">Principal</div>
                <div class="menu-item active" onclick="mudarVisao('dashboard', this)">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </div>
                <div class="menu-item" onclick="mudarVisao('relatorios', this)">
                    <i class="fa-solid fa-boxes-stacked"></i> Fornecedores & Peças
                </div>

                <div class="menu-label">Sistema</div>
                <div class="menu-item" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </div>

                <div class="ai-card card-box" style="margin-top: auto; max-height: 250px;">
                    <div class="ai-header">
                        <i class="fa-solid fa-robot"></i> <span class="ai-title">Insight Rápido</span>
                    </div>
                    <div id="sidebarAiSummary" style="font-size: 12px; color: #cbd5e1;">
                        Carregando análise...
                    </div>
                </div>
            </div>

            <div class="main">
                
                <div id="view-dashboard" class="view-section active-view">
                    <h1 class="header-title">Visão Geral</h1>
                    <p class="header-subtitle">Resumo financeiro e métricas de desempenho.</p>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #eff6ff; color: #3b82f6;"><i class="fa-solid fa-wallet"></i></div>
